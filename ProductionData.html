<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Data</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .tab-content {
            padding: 20px;
        }
        .form-section {
            margin-bottom: 20px;
        }
        .form-group-custom {
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            background-color: #f8f9fa;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h3>Production Data</h3>

        <!-- Navigation Tabs -->
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="design-factors-tab" data-bs-toggle="tab" data-bs-target="#design-factors" type="button" role="tab" aria-controls="design-factors" aria-selected="true">Design Factors</button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="myTabContent">
            <!-- Production Data Tab -->
            <div class="tab-pane fade show active" id="production-data" role="tabpanel" aria-labelledby="production-data">
                <div class="form-section">
                    <h4>Packer-Data</h4>
                    <div class="form-group-custom">
                        <label for="fluid-density">Fluid Density:</label>
                        <input type="text" class="form-control" id="fluid-density" value="#">
                    </div>
                    <div class="form-group-custom">
                        <label for="packer-depth-md">Packer Depth, MD:</label>
                        <input type="text" class="form-control" id="packer-depth-md" value="#">
                    </div>
                </div>

                <div class="form-section">
                    <h4>Reservoir Data</h4>
                    <div class="form-group-custom">
                        <label for="perforation-depth">Perforation Depth:</label>
                        <input type="text" class="form-control" id="perforation-depth" value="#1111">
                    </div>
                    <div class="form-group-custom">
                        <label for="gas-gravity">Gas Gravity:</label>
                        <input type="text" class="form-control" id="gas-gravity" value="0.7">
                    </div>
                    <div class="form-group-custom">
                        <label for="gas-oil-/-gradient">Gas/Oil Gradient:</label>
                        <input type="text" class="form-control" id="gas-oil-/-gradient" value="0.1">
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="row">
            <div class="col">
                <button type="button" class="btn btn-primary">OK</button>
                <button type="button" class="btn btn-secondary">Cancel</button>
                <button type="button" class="btn btn-success">Apply</button>
                <button type="button" class="btn btn-info">Help</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
