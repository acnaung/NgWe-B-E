<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drilling</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-image: url('Images/DesertRig.jpg'); /* Specify the path to your image */
            background-size: cover; /* Ensure the image covers the entire background */
            background-repeat: no-repeat; /* Prevent the image from repeating */
            background-attachment: fixed; /* Make the background image fixed in place */
            background-position: center; /* Center the background image */
            color: white; /* Ensure text is readable on dark background */
        }
        header {
            text-align: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
        }
        .card {
            background-color: rgba(255, 255, 255, 0.9); /* Slightly transparent background for cards */
        }
    </style>
</head>
<body>
    <header>
        <h1>This is the Drilling Section</h1>
    </header>
    <main class="container my-5">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Exploration Drilling</h5>
                        <p class="card-text">Information about Exploration Drilling.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Appraisal Drilling</h5>
                        <p class="card-text">Information about Appraisal Drilling.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Development Drilling</h5>
                        <p class="card-text">Information about Development Drilling.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
