<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casing Design - Drilling Loads</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Drilling Loads</h2>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Scenario</th>
                    <th>Select</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Displacement to Gas</td>
                    <td><input type="checkbox"></td>
                </tr>
                <tr>
                    <td>Gas Kick Profile</td>
                    <td><input type="checkbox"></td>
                </tr>
                <tr>
                    <td>Fracture @ Shoe w/ Gas Gradient Above</td>
                    <td><input type="checkbox"></td>
                </tr>
                <tr>
                    <td>Fracture @ Shoe w/ 1/3 BHP at Surface</td>
                    <td><input type="checkbox"></td>
                </tr>
                <!-- Add more rows as needed -->
                <tr>
                    <td>Injection Down Casing</td>
                    <td><input type="checkbox" checked></td>
                </tr>
                <tr>
                    <td>Gas Migration</td>
                    <td><input type="checkbox"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
